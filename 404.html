<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Page Not Found - School #37 Samarkand</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --terracotta: #D2691E;
            --amber: #FFB347;
            --cream: #FDF5E6;
            --charcoal: #36454F;
            color-scheme: light;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--cream);
            color: var(--charcoal);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            text-align: center;
        }

        .code {
            font-family: 'Playfair Display', serif;
            font-size: clamp(5rem, 20vw, 9rem);
            font-weight: 700;
            line-height: 1;
            margin: 0;
            background: linear-gradient(135deg, var(--terracotta), var(--amber));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.5rem, 5vw, 2.25rem);
            margin: 1rem 0 0.5rem;
        }

        p { color: #6b7280; max-width: 34rem; margin: 0 auto 2rem; line-height: 1.7; }

        .links { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; }

        .links a {
            display: inline-block;
            padding: 0.85rem 1.75rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .primary { background: var(--terracotta); color: #fff; }
        .secondary { background: #fff; color: var(--terracotta); border: 2px solid var(--terracotta); }
        .links a:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(210, 105, 30, 0.2); }
    </style>
</head>
<body>
    <main>
        <p class="code">404</p>
        <h1>This page has gone missing</h1>
        <p>
            The page you were looking for doesn't exist, or it may have moved.
            Let's get you back to somewhere useful.
        </p>
        <div class="links">
            <a class="primary" href="/">Back to Home</a>
            <a class="secondary" href="/contact.html">Contact the School</a>
        </div>
    </main>
</body>
</html>
